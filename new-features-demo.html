<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIIP v1.1.0 - New Features Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .feature-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-color: #667eea;
        }
        
        .feature-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="file"],
        select,
        input[type="range"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="file"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        input[type="range"] {
            padding: 0;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result-area {
            margin-top: 20px;
            text-align: center;
        }
        
        .result-area img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .status.processing {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .intensity-value {
            display: inline-block;
            margin-left: 10px;
            color: #667eea;
            font-weight: 600;
        }
        
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 EIIP v1.1.0 <span class="badge">NEW FEATURES</span></h1>
        <p class="subtitle">Image Cropping • Effects & Filters • PDF Conversion</p>
        
        <div class="feature-grid">
            <!-- Image Cropper -->
            <div class="feature-card">
                <h3>✂️ Image Cropper</h3>
                <div class="input-group">
                    <label>Upload Image</label>
                    <input type="file" id="cropInput" accept="image/*">
                </div>
                <div class="input-group">
                    <label>Crop Type</label>
                    <select id="cropType">
                        <option value="circle">Circle (Avatar)</option>
                        <option value="square">Square (1:1)</option>
                        <option value="landscape">Landscape (16:9)</option>
                        <option value="portrait">Portrait (9:16)</option>
                        <option value="instagram">Instagram (4:5)</option>
                    </select>
                </div>
                <button onclick="performCrop()">Crop Image</button>
                <div class="result-area" id="cropResult"></div>
                <div class="status" id="cropStatus" style="display:none;"></div>
            </div>
            
            <!-- Image Effects -->
            <div class="feature-card">
                <h3>🌈 Image Effects</h3>
                <div class="input-group">
                    <label>Upload Image</label>
                    <input type="file" id="effectInput" accept="image/*">
                </div>
                <div class="input-group">
                    <label>Choose Effect</label>
                    <select id="effectType">
                        <option value="grayscale">Grayscale</option>
                        <option value="sepia">Sepia</option>
                        <option value="vintage">Vintage</option>
                        <option value="warm">Warm</option>
                        <option value="cool">Cool</option>
                        <option value="brightness">Brightness</option>
                        <option value="contrast">Contrast</option>
                        <option value="invert">Invert</option>
                        <option value="blur">Blur</option>
                        <option value="sharpen">Sharpen</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Intensity <span class="intensity-value" id="intensityValue">1.0</span></label>
                    <input type="range" id="intensity" min="0" max="100" value="100" 
                           oninput="document.getElementById('intensityValue').textContent = (this.value / 100).toFixed(2)">
                </div>
                <button onclick="applyEffect()">Apply Effect</button>
                <div class="result-area" id="effectResult"></div>
                <div class="status" id="effectStatus" style="display:none;"></div>
            </div>
            
            <!-- PDF Converter -->
            <div class="feature-card">
                <h3>📄 PDF Converter</h3>
                <div class="input-group">
                    <label>Upload Images</label>
                    <input type="file" id="pdfInput" accept="image/*" multiple>
                </div>
                <div class="input-group">
                    <label>Page Size</label>
                    <select id="pageSize">
                        <option value="A4">A4</option>
                        <option value="LETTER">Letter</option>
                        <option value="LEGAL">Legal</option>
                        <option value="A3">A3</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Orientation</label>
                    <select id="orientation">
                        <option value="portrait">Portrait</option>
                        <option value="landscape">Landscape</option>
                    </select>
                </div>
                <button onclick="createPDF()">Create PDF</button>
                <div class="result-area" id="pdfResult"></div>
                <div class="status" id="pdfStatus" style="display:none;"></div>
            </div>
        </div>
    </div>
    
    <script src="eiip.min.js"></script>
    <script>
        const eiip = new EIIP({ debug: true });
        
        function showStatus(elementId, message, type) {
            const statusEl = document.getElementById(elementId);
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
        }
        
        function hideStatus(elementId) {
            document.getElementById(elementId).style.display = 'none';
        }
        
        async function performCrop() {
            const input = document.getElementById('cropInput');
            const cropType = document.getElementById('cropType').value;
            const resultDiv = document.getElementById('cropResult');
            
            if (!input.files[0]) {
                showStatus('cropStatus', 'Please select an image first', 'error');
                return;
            }
            
            showStatus('cropStatus', 'Cropping image...', 'processing');
            
            try {
                let result;
                
                if (cropType === 'circle') {
                    result = await eiip.cropToCircle(input.files[0], {
                        size: 400,
                        format: 'png'
                    });
                } else {
                    const aspectRatios = {
                        square: EIIP.ImageCropper.ASPECT_RATIOS.SQUARE,
                        landscape: EIIP.ImageCropper.ASPECT_RATIOS.LANDSCAPE,
                        portrait: EIIP.ImageCropper.ASPECT_RATIOS.PORTRAIT,
                        instagram: EIIP.ImageCropper.ASPECT_RATIOS.INSTAGRAM
                    };
                    
                    result = await eiip.cropToAspectRatio(
                        input.files[0],
                        aspectRatios[cropType],
                        { format: 'png' }
                    );
                }
                
                resultDiv.innerHTML = `<img src="${result.dataUrl}" alt="Cropped">`;
                showStatus('cropStatus', `✅ Cropped to ${result.width}x${result.height}`, 'success');
            } catch (error) {
                showStatus('cropStatus', `Error: ${error.message}`, 'error');
            }
        }
        
        async function applyEffect() {
            const input = document.getElementById('effectInput');
            const effectType = document.getElementById('effectType').value;
            const intensity = document.getElementById('intensity').value / 100;
            const resultDiv = document.getElementById('effectResult');
            
            if (!input.files[0]) {
                showStatus('effectStatus', 'Please select an image first', 'error');
                return;
            }
            
            showStatus('effectStatus', `Applying ${effectType} effect...`, 'processing');
            
            try {
                const result = await eiip.applyEffect(
                    input.files[0],
                    effectType,
                    intensity,
                    { format: 'jpg', quality: 0.9 }
                );
                
                resultDiv.innerHTML = `<img src="${result.dataUrl}" alt="With Effect">`;
                showStatus('effectStatus', `✅ Applied ${effectType} effect`, 'success');
            } catch (error) {
                showStatus('effectStatus', `Error: ${error.message}`, 'error');
            }
        }
        
        async function createPDF() {
            const input = document.getElementById('pdfInput');
            const pageSize = document.getElementById('pageSize').value;
            const orientation = document.getElementById('orientation').value;
            const resultDiv = document.getElementById('pdfResult');
            
            if (!input.files.length) {
                showStatus('pdfStatus', 'Please select at least one image', 'error');
                return;
            }
            
            showStatus('pdfStatus', `Creating PDF with ${input.files.length} image(s)...`, 'processing');
            
            try {
                const images = Array.from(input.files);
                
                const result = await eiip.convertImagesToPDF(images, {
                    pageSize: EIIP.PDFConverter.PAGE_SIZES[pageSize],
                    orientation: orientation
                });
                
                resultDiv.innerHTML = `
                    <img src="${result.dataUrls[0]}" alt="PDF Preview" style="max-width: 300px;">
                    <p style="margin-top: 10px;">
                        <button onclick="window.open('${result.downloadUrl}', '_blank')">
                            📥 Download PDF Preview
                        </button>
                    </p>
                `;
                
                showStatus('pdfStatus', `✅ PDF created with ${result.pageCount} page(s)`, 'success');
            } catch (error) {
                showStatus('pdfStatus', `Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
